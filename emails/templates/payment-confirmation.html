<p style="margin:0 0 16px;font-size:16px;color:#e5e5e5">Cảm ơn <strong>{{name}}</strong>,</p>
<p style="margin:0 0 24px;font-size:14px;color:#a0a0a0;line-height:1.6">
  Thanh toán của bạn đã được xác nhận. Chi tiết đơn hàng:
</p>

<table width="100%" cellpadding="0" cellspacing="0" style="background:#0a0a0a;border:1px solid #2a2a2a;border-radius:8px;margin-bottom:28px">
  <tr><td style="padding:20px 24px">
    <table width="100%" cellpadding="0" cellspacing="0">
      <tr>
        <td style="padding:6px 0;font-size:13px;color:#666">Sản phẩm</td>
        <td style="padding:6px 0;font-size:13px;color:#fff;text-align:right">{{productName}}</td>
      </tr>
      <tr>
        <td style="padding:6px 0;font-size:13px;color:#666">Số tiền</td>
        <td style="padding:6px 0;font-size:15px;color:#b6ff00;font-weight:700;text-align:right">{{amount}} {{currency}}</td>
      </tr>
      <tr>
        <td style="padding:6px 0;font-size:13px;color:#666">Mã đơn</td>
        <td style="padding:6px 0;font-size:12px;color:#a0a0a0;text-align:right;font-family:monospace">{{orderRef}}</td>
      </tr>
      <tr>
        <td style="padding:6px 0;font-size:13px;color:#666">Ngày</td>
        <td style="padding:6px 0;font-size:13px;color:#a0a0a0;text-align:right">{{date}}</td>
      </tr>
    </table>
  </td></tr>
</table>

<table width="100%" cellpadding="0" cellspacing="0">
  <tr><td align="center">
    <a href="{{portalUrl}}" style="display:inline-block;padding:14px 36px;background:#b6ff00;color:#000;font-size:15px;font-weight:700;text-decoration:none;border-radius:8px">
      Truy cập sản phẩm →
    </a>
  </td></tr>
</table>

<p style="margin:24px 0 0;font-size:11px;color:#555;text-align:center">
  Giữ email này làm hóa đơn điện tử.
</p>
