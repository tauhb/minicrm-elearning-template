<p style="margin:0 0 16px;font-size:16px;color:#e5e5e5">Chào mừng <strong>{{name}}</strong> 🎉</p>
<p style="margin:0 0 24px;font-size:14px;color:#a0a0a0;line-height:1.6">
  Bạn đã được ghi danh vào khóa học:
</p>

<table width="100%" cellpadding="0" cellspacing="0" style="background:#0a0a0a;border:1px solid #2a2a2a;border-radius:8px;margin-bottom:28px">
  <tr><td style="padding:20px 24px">
    <p style="margin:0 0 8px;font-size:12px;color:#666;text-transform:uppercase;letter-spacing:1px">Khóa học</p>
    <p style="margin:0 0 16px;font-size:18px;color:#fff;font-weight:700">{{courseName}}</p>
    {{#if startDate}}
    <p style="margin:0 0 8px;font-size:12px;color:#666;text-transform:uppercase;letter-spacing:1px">Bắt đầu</p>
    <p style="margin:0;font-size:14px;color:#b6ff00;font-weight:600">{{startDate}}</p>
    {{/if}}
  </td></tr>
</table>

<table width="100%" cellpadding="0" cellspacing="0">
  <tr><td align="center">
    <a href="{{courseUrl}}" style="display:inline-block;padding:14px 36px;background:#b6ff00;color:#000;font-size:15px;font-weight:700;text-decoration:none;border-radius:8px">
      Bắt đầu học ngay →
    </a>
  </td></tr>
</table>
