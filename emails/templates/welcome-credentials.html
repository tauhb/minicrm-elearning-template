<p style="margin:0 0 16px;font-size:16px;color:#e5e5e5">Xin chào <strong>{{name}}</strong>,</p>
<p style="margin:0 0 24px;font-size:14px;color:#a0a0a0;line-height:1.6">
  Tài khoản của bạn trên <strong style="color:#fff">{{appName}}</strong> đã được tạo. Dưới đây là thông tin đăng nhập:
</p>

<table width="100%" cellpadding="0" cellspacing="0" style="background:#0a0a0a;border:1px solid #2a2a2a;border-radius:8px;margin-bottom:28px">
  <tr><td style="padding:20px 24px">
    <p style="margin:0 0 12px;font-size:12px;color:#666;text-transform:uppercase;letter-spacing:1px">Email</p>
    <p style="margin:0 0 20px;font-size:15px;color:#fff;font-family:monospace">{{email}}</p>
    <p style="margin:0 0 12px;font-size:12px;color:#666;text-transform:uppercase;letter-spacing:1px">Mật khẩu</p>
    <p style="margin:0;font-size:18px;color:#b6ff00;font-family:monospace;font-weight:700;letter-spacing:2px">{{password}}</p>
  </td></tr>
</table>

<table width="100%" cellpadding="0" cellspacing="0">
  <tr><td align="center">
    <a href="{{portalUrl}}" style="display:inline-block;padding:14px 36px;background:#b6ff00;color:#000;font-size:15px;font-weight:700;text-decoration:none;border-radius:8px">
      Truy cập {{appName}} →
    </a>
  </td></tr>
</table>

<p style="margin:24px 0 0;font-size:12px;color:#555;text-align:center">
  Bạn nên đổi mật khẩu sau lần đăng nhập đầu tiên.
</p>
