<p style="margin:0 0 14px;font-size:15px;color:#e5e5e5">Xin chào <strong>{{name}}</strong>,</p>
<div style="font-size:14px;color:#d0d0d0;line-height:1.7">
  {{body}}
</div>
{{#if ctaUrl}}
<table width="100%" cellpadding="0" cellspacing="0" style="margin-top:24px">
  <tr><td align="center">
    <a href="{{ctaUrl}}" style="display:inline-block;padding:13px 32px;background:#b6ff00;color:#000;font-size:14px;font-weight:700;text-decoration:none;border-radius:8px">
      {{ctaText}} →
    </a>
  </td></tr>
</table>
{{/if}}
<p style="margin:24px 0 0;font-size:11px;color:#555;text-align:center;line-height:1.5">
  Bạn nhận email này vì đăng ký {{appName}}.<br>
  <a href="{{unsubscribeUrl}}" style="color:#666;text-decoration:underline">Huỷ đăng ký</a>
</p>
